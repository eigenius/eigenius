[package]
name = "eigenius-wasm-cbor-echo"
version = "0.1.0"
edition = "2021"
description = "Test fixture: decodes its input resource via the SDK (ciborium) and re-encodes it unchanged. Used to cross-check cbor-x ↔ ciborium interop."

[dependencies]
eigenius-wasm-sdk = { path = "../../sdk/wasm-sdk" }
wit-bindgen = "0.57"

[lib]
crate-type = ["cdylib"]

[package.metadata.component]
package = "eigenius:component"

[package.metadata.component.target]
world = "eigenius-component-io"
path = "../../wit"
