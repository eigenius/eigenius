[package]
name = "eigenius-kernel"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
async-trait = "0.1"
ciborium = "0.2"
hex = "0.4"
# Concurrent cache for the bounded two-pool resource cache (D23 §5.3 /
# Phase 14c). W-TinyLFU eviction outperforms LRU/ARC on skewed access
# patterns and the crate is production-grade in Rust services.
moka = { version = "0.12", features = ["sync"] }
regex = "1"
sha2 = "0.10"
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
tokio.workspace = true
tokio-stream = "0.1"
tonic.workspace = true
tonic-web.workspace = true
prost.workspace = true
uuid.workspace = true
wasmtime.workspace = true
eigenius-wasm-runtime.workspace = true

[build-dependencies]
tonic-build = "0.12"

[dev-dependencies]
proptest.workspace = true
