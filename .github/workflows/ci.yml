name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  rust:
    name: Rust checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler libclang-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.toml') }}

      - name: Check formatting
        run: cargo fmt --all -- --check

      # Build the WASM example components first — `kernel/src/capability/tests.rs`
      # `include_bytes!`s the resulting `.wasm` files from
      # `kernel/tests/fixtures/`. Both clippy (which compiles
      # `--all-targets`, including test binaries) and `cargo test` need
      # the fixtures present, so this has to come before either.
      - name: Install cargo-component
        run: cargo install --locked cargo-component@^0.21

      - name: Add wasm32 target
        run: rustup target add wasm32-unknown-unknown wasm32-wasip1

      - name: Build WASM fixtures
        # Each example is its own workspace; build from inside the
        # crate dir, then copy the artifact into the kernel's
        # gitignored fixtures directory.
        run: |
          (cd examples/wasm-doc-validator && cargo component build)
          (cd examples/wasm-ordering-institution && cargo component build)
          mkdir -p kernel/tests/fixtures
          cp examples/wasm-doc-validator/target/wasm32-unknown-unknown/debug/eigenius_wasm_doc_validator.wasm kernel/tests/fixtures/
          cp examples/wasm-ordering-institution/target/wasm32-unknown-unknown/debug/eigenius_wasm_ordering_institution.wasm kernel/tests/fixtures/

      - name: Clippy
        run: cargo clippy --workspace --all-targets

      - name: Run tests
        run: cargo test --workspace

  deno:
    name: Deno checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: orchestration
    steps:
      - uses: actions/checkout@v4

      - name: Install Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Lint
        run: deno lint

      - name: Format check
        run: deno fmt --check

      - name: Run tests
        run: deno test --allow-net --allow-env

  proto:
    name: Protobuf lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install buf
        uses: bufbuild/buf-setup-action@v1

      - name: Lint protos
        run: buf lint
