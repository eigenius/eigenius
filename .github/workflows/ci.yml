name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"
  # CI always starts from a cold cache, so incremental compilation
  # buys no rebuild speed-up and just inflates target/ with per-crate
  # intermediate artifacts. Disabling it typically halves target/
  # size on a workspace this big — relevant because we've hit the
  # GitHub-hosted runner's disk ceiling more than once.
  CARGO_INCREMENTAL: "0"

jobs:
  rust:
    name: Rust checks
    runs-on: ubuntu-latest
    steps:
      # Reclaim ~30 GB on the GitHub-hosted runner by removing
      # pre-installed tooling the Rust workspace doesn't use (Android
      # SDK, .NET, Haskell, swap). The stacked footprint of the Lean
      # toolchain + workspace target/ otherwise overflows the runner's
      # 80 GB disk. Run before checkout so the cleanup happens with no
      # contention from the workspace.
      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: false
          swap-storage: true

      - uses: actions/checkout@v5

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler libclang-dev

      # The `eigenius-lean-worker` crate's build.rs compiles a C bridge
      # against Lean's `lean.h` to talk to the Lean runtime. `lean.h`
      # ships with the Lean toolchain via elan, not with system packages,
      # so CI has to install elan + the pinned toolchain before running
      # cargo. The toolchain version is read from
      # `lean/runtime-worker/lean-toolchain` (the workspace's single
      # source of truth — same file the Dockerfile composer bakes into
      # env images). See `docs/notes/lean-toolchain-upgrade.md` for the
      # upgrade discipline.
      - name: Install elan + pinned Lean toolchain
        run: |
          set -euo pipefail
          # Download and install elan (Lean's toolchain manager). The
          # `--default-toolchain none` flag avoids pulling a fallback
          # toolchain — we install the pinned version explicitly below.
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.elan/bin:$PATH"
          # Install the toolchain pinned by the workspace's
          # `lean-toolchain` file. `elan` would do this on first use,
          # but doing it explicitly here keeps the install step's
          # caching/timing surface visible.
          TOOLCHAIN=$(cat lean/runtime-worker/lean-toolchain)
          echo "Installing Lean toolchain: $TOOLCHAIN"
          elan toolchain install "$TOOLCHAIN"
          elan default "$TOOLCHAIN"
          # Verify `lean.h` is reachable — the build.rs's discovery path.
          PREFIX=$(lean --print-prefix)
          echo "Lean prefix: $PREFIX"
          test -f "$PREFIX/include/lean/lean.h"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      # Swatinem/rust-cache is the de-facto standard for Rust on GHA:
      # - splits the cache into deps (keyed on Cargo.lock) and workspace
      #   (keyed on source-only changes), so a Cargo.toml addition still
      #   hits the closest matching cache via restore-keys.
      # - prunes unused targets automatically; cache size stays bounded.
      # Drop-in replacement for the previous flat actions/cache step that
      # invalidated everything on any Cargo.toml change.
      - name: Cache cargo + target
        uses: Swatinem/rust-cache@v2
        with:
          # Bump this when the cache schema changes (rare).
          prefix-key: v1-rust
          workspaces: |
            .
            orchestration/runtime-substrate-native

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets

      - name: Run tests
        run: cargo test --workspace

  deno:
    name: Deno checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: orchestration
    steps:
      - uses: actions/checkout@v5

      - name: Install Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Lint
        run: deno lint

      - name: Format check
        run: deno fmt --check

      - name: Run tests
        run: deno test --allow-net --allow-env

  proto:
    name: Protobuf lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install buf
        uses: bufbuild/buf-setup-action@v1

      - name: Lint protos
        run: buf lint
