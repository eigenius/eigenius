name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  rust:
    name: Rust checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler libclang-dev

      # The `eigenius-lean-worker` crate's build.rs compiles a C bridge
      # against Lean's `lean.h` to talk to the Lean runtime. `lean.h`
      # ships with the Lean toolchain via elan, not with system packages,
      # so CI has to install elan + the pinned toolchain before running
      # cargo. The toolchain version is read from
      # `lean/runtime-worker/lean-toolchain` (the workspace's single
      # source of truth — same file the Dockerfile composer bakes into
      # env images). See `docs/notes/lean-toolchain-upgrade.md` for the
      # upgrade discipline.
      - name: Install elan + pinned Lean toolchain
        run: |
          set -euo pipefail
          # Download and install elan (Lean's toolchain manager). The
          # `--default-toolchain none` flag avoids pulling a fallback
          # toolchain — we install the pinned version explicitly below.
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.elan/bin:$PATH"
          # Install the toolchain pinned by the workspace's
          # `lean-toolchain` file. `elan` would do this on first use,
          # but doing it explicitly here keeps the install step's
          # caching/timing surface visible.
          TOOLCHAIN=$(cat lean/runtime-worker/lean-toolchain)
          echo "Installing Lean toolchain: $TOOLCHAIN"
          elan toolchain install "$TOOLCHAIN"
          elan default "$TOOLCHAIN"
          # Verify `lean.h` is reachable — the build.rs's discovery path.
          PREFIX=$(lean --print-prefix)
          echo "Lean prefix: $PREFIX"
          test -f "$PREFIX/include/lean/lean.h"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          # cargo-component (installed below) ships its own wasm32-unknown-unknown
          # / wasm32-wasip1 toolchain components on demand, but doing it here too
          # lets the rust-cache step capture them.
          targets: wasm32-unknown-unknown, wasm32-wasip1

      # Swatinem/rust-cache is the de-facto standard for Rust on GHA:
      # - splits the cache into deps (keyed on Cargo.lock) and workspace
      #   (keyed on source-only changes), so a Cargo.toml addition still
      #   hits the closest matching cache via restore-keys.
      # - prunes unused targets automatically; cache size stays bounded.
      # - preserves ~/.cargo/bin so cargo-component (gated below) survives
      #   across runs without a separate cache.
      # Drop-in replacement for the previous flat actions/cache step that
      # invalidated everything on any Cargo.toml change.
      - name: Cache cargo + target
        uses: Swatinem/rust-cache@v2
        with:
          # Bump this when the cache schema changes (rare).
          prefix-key: v1-rust
          # Cache cargo-component too — it lives in ~/.cargo/bin.
          cache-bin: true
          # Cache the WASM example crates' build dirs alongside the main
          # workspace target; their `cargo component build` outputs are
          # what feeds the WASM fixtures cache below.
          workspaces: |
            .
            examples/wasm-cbor-echo
            examples/wasm-doc-validator
            examples/wasm-d14-echo
            examples/wasm-d14-dock
            examples/wasm-d14-assay
            examples/wasm-d14-arrhenius
            examples/wasm-http-shout
            examples/wasm-read-query-probe
            orchestration/runtime-substrate-native

      - name: Check formatting
        run: cargo fmt --all -- --check

      # Build the WASM example components first — `kernel/src/capability/tests.rs`
      # `include_bytes!`s the resulting `.wasm` files from
      # `kernel/tests/fixtures/`. Both clippy (which compiles
      # `--all-targets`, including test binaries) and `cargo test` need
      # the fixtures present, so this has to come before either.
      - name: Install cargo-component
        # `cargo install` was the dominant cost of the pipeline (~12 min
        # of recompilation on every run). The cargo cache step above
        # restores `~/.cargo/bin/cargo-component` and the `.crates.toml`
        # / `.crates2.json` metadata that lets cargo know it owns the
        # binary; if those are intact AND match the pinned version
        # range, skip the install entirely. Otherwise rebuild.
        run: |
          if command -v cargo-component >/dev/null \
              && cargo-component --version 2>/dev/null | grep -q "cargo-component 0\.21\."; then
            echo "cargo-component already installed: $(cargo-component --version)"
          else
            cargo install --locked --force cargo-component@^0.21
          fi

      # The WASM fixtures only change when their source trees change.
      # Cache the built `.wasm` artifacts under `kernel/tests/fixtures/`
      # keyed on a hash of every input that can affect the output:
      # the example crate sources, the shared SDK they link against,
      # the WIT bindings, and the cargo-component pin. Drops a ~5min
      # `cargo component build` step on cache-hit runs.
      - name: Cache WASM fixtures
        id: wasm-fixtures-cache
        uses: actions/cache@v4
        with:
          path: kernel/tests/fixtures
          key: ${{ runner.os }}-wasm-fixtures-cc0.21-${{ hashFiles('examples/wasm-doc-validator/**', 'examples/wasm-d14-echo/**', 'examples/wasm-d14-dock/**', 'examples/wasm-d14-assay/**', 'examples/wasm-d14-arrhenius/**', 'sdk/wasm-sdk/**', 'wit/**') }}

      - name: Build WASM fixtures
        if: steps.wasm-fixtures-cache.outputs.cache-hit != 'true'
        # Each example is its own workspace; build from inside the
        # crate dir, then copy the artifact into the kernel's
        # gitignored fixtures directory.
        run: |
          (cd examples/wasm-doc-validator && cargo component build)
          (cd examples/wasm-d14-echo && cargo component build)
          (cd examples/wasm-d14-dock && cargo component build)
          (cd examples/wasm-d14-assay && cargo component build)
          (cd examples/wasm-d14-arrhenius && cargo component build)
          mkdir -p kernel/tests/fixtures
          cp examples/wasm-doc-validator/target/wasm32-unknown-unknown/debug/eigenius_wasm_doc_validator.wasm kernel/tests/fixtures/
          cp examples/wasm-d14-echo/target/wasm32-unknown-unknown/debug/eigenius_wasm_d14_echo.wasm kernel/tests/fixtures/
          cp examples/wasm-d14-dock/target/wasm32-unknown-unknown/debug/eigenius_wasm_d14_dock.wasm kernel/tests/fixtures/
          cp examples/wasm-d14-assay/target/wasm32-unknown-unknown/debug/eigenius_wasm_d14_assay.wasm kernel/tests/fixtures/
          cp examples/wasm-d14-arrhenius/target/wasm32-unknown-unknown/debug/eigenius_wasm_d14_arrhenius.wasm kernel/tests/fixtures/

      - name: Clippy
        run: cargo clippy --workspace --all-targets

      - name: Run tests
        run: cargo test --workspace

  deno:
    name: Deno checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: orchestration
    steps:
      - uses: actions/checkout@v4

      - name: Install Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Lint
        run: deno lint

      - name: Format check
        run: deno fmt --check

      - name: Run tests
        run: deno test --allow-net --allow-env

  proto:
    name: Protobuf lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install buf
        uses: bufbuild/buf-setup-action@v1

      - name: Lint protos
        run: buf lint
