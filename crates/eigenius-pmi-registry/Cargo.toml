[package]
name = "eigenius-pmi-registry"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Convert PMI Case Registry records (UAB experiment 02) into an ESL layer over the variant and clinical vocabularies — no parser (D99 step 4)."

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
clap = { version = "4", features = ["derive"] }
# HGVS parsing, shared with the kernel's document glossary since 2026-10-11. Zero-dependency leaf
# crate, so this does not pull the kernel into a lib that is deliberately kernel-free.
eigenius-notation = { path = "../eigenius-notation" }

[dev-dependencies]
eigenius-kernel = { path = "../../kernel" }
# `snapshot::open_head_and_backend`, for the DB-backed SYN-26-002 test.
eigenius-encoding = { path = "../eigenius-encoding" }

[[bin]]
name = "pmi-registry-convert"
path = "src/bin/pmi_registry_convert.rs"
