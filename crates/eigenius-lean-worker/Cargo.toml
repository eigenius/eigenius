[package]
name = "eigenius-lean-worker"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Worker-side substrate protocol shim for the Lean language runtime. Exposes a C-ABI surface that the Lake-built Lean worker links against; Rust handles UDS + CBOR transport, Lean handles per-verb dispatch via @[export]-ed functions. See D26 §8.1, Phase 20a.5b."

[lib]
# `cdylib` produces a shared library the Lean worker links against
# via Lake's `extraLinkArgs`. `rlib` lets the in-crate integration
# test exercise the protocol loop without the FFI boundary — useful
# while Lean-side authoring is still pending.
crate-type = ["cdylib", "rlib"]

[dependencies]
eigenius-runtime-substrate = { path = "../runtime-substrate" }
# `dispatch_method_request` decodes the `MethodInvocation` carried in
# `Request::DispatchMethod` to route between the lean_export and
# dispatch_method Lean handlers; ciborium is the substrate's own CBOR
# codec so the dep is consistent across both sides of the wire.
ciborium = "0.2"
serde.workspace = true
serde_bytes = "0.11"
thiserror.workspace = true
