[package]
name = "eigenius-orchestrator-wasm"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "napi-rs + wasmtime native addon for hosting IO WASM components in the Eigenius orchestrator."

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
napi = { version = "3", default-features = false, features = ["napi8", "tokio_rt", "async"] }
napi-derive = "3"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "time", "macros", "sync"] }
wasmtime = { version = "43", features = ["component-model", "async"] }
eigenius-wasm-runtime = { path = "../../crates/wasm-runtime" }
anyhow = "1"
sha2 = "0.10"
hex = "0.4"
dashmap = "6"
once_cell = "1"
dirs = "5"

[build-dependencies]
napi-build = "2"

[dev-dependencies]
ciborium = "0.2"
tempfile = "3"

[profile.release]
lto = true
