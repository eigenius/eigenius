[workspace]
resolver = "2"
members = [
    "kernel",
    "crates/wasm-runtime",
    "sdk/wasm-sdk",
    "storage/tikv",
    "storage/rocksdb",
    "storage/memory",
    "storage/indexing",
    "cli",
]
exclude = [
    "examples/wasm-cbor-echo",
    "examples/wasm-doc-validator",
    "examples/wasm-http-shout",
    "examples/wasm-ordering-institution",
    "examples/wasm-read-query-probe",
    "orchestration/native",
    "spikes/napi-rs-async",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/eigenius/eigenius"

[workspace.dependencies]
# Shared dependencies across workspace crates
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tokio = { version = "1", features = ["full"] }
tonic = "0.12"
prost = "0.13"
uuid = { version = "1", features = ["v4", "serde"] }

# WASM runtime
wasmtime = { version = "43", features = ["component-model"] }
eigenius-wasm-runtime = { path = "crates/wasm-runtime" }

# Testing
proptest = "1"
criterion = { version = "0.5", features = ["html_reports"] }
