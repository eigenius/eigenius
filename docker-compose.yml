# Eigenius Local Development Stack
#
# Runs the kernel and orchestrator together for local integration testing.
#
# Usage:
#   docker compose build
#   docker compose up
#
# With real LLM calls (requires ANTHROPIC_API_KEY):
#   ANTHROPIC_API_KEY=sk-... docker compose up
#
# With mock LLM (no API key needed):
#   EIGENIUS_MOCK_LLM=true docker compose up
#
# Test health:
#   curl http://localhost:8080/health
#
# Test kernel (via CLI):
#   eigenius --endpoint http://localhost:50051 inspect "urn:eigenius:core:Class"

services:
  kernel:
    # An explicit `image:` tag lets CI build the image once with
    # `docker buildx build --tag eigenius-kernel:local --load` (with
    # GHA layer caching) and then `docker compose up -d --no-build` to
    # run it. Local devs still get the regular `docker compose build`
    # behaviour because `build:` is also present.
    image: eigenius-kernel:local
    build:
      context: .
      dockerfile: deploy/Dockerfile.kernel
    ports:
      - "50051:50051"
    environment:
      - EIGENIUS_ORCHESTRATOR_ENDPOINT=http://orchestrator:8080
      - RUST_LOG=${RUST_LOG:-info}
      # Cap glibc's per-thread malloc arenas. The kernel runs on the system allocator (jemalloc is
      # opt-in, `--features jemalloc-prof`), and glibc gives a tokio/tonic server up to 8×ncores
      # arenas that grow independently and never hand pages back — so a bulk load's allocation churn
      # (JSON decode + Rule 21 type-check on millions of `lexicon:cat` values) inflates RSS far past
      # what is live. MEASURED on the WordNet chain, identical load, allocator the only variable
      # (docs/notes/2026-08-03-reseed-memory-profile.md):
      #     default arenas   peak 15.66 GB
      #     ARENA_MAX=2      peak  9.41 GB     ← 40% less, and it is the difference between a
      #                                          lexicon reseed fitting a 32 GB host and not
      # Not mystery tuning: delete this and the reseed goes back to running at the edge of RAM.
      - MALLOC_ARENA_MAX=${MALLOC_ARENA_MAX:-2}
    command: ["serve", "--port", "50051", "--orchestrator", "http://orchestrator:8080", "--db", "/var/lib/eigenius/db"]
    volumes:
      - eigenius_db:/var/lib/eigenius/db
    depends_on:
      orchestrator:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "eigenius", "--endpoint", "http://localhost:50051", "inspect", "urn:eigenius:core:Class"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

  orchestrator:
    image: eigenius-orchestrator:local
    build:
      context: .
      dockerfile: deploy/Dockerfile.orchestration
    ports:
      - "8080:8080"
    environment:
      - EIGENIUS_KERNEL_ENDPOINT=http://kernel:50051
      - EIGENIUS_ORCHESTRATOR_PORT=8080
      - EIGENIUS_MOCK_LLM=${EIGENIUS_MOCK_LLM:-false}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - EIGENIUS_LOG_LEVEL=${EIGENIUS_LOG_LEVEL:-info}
    volumes:
      # Docker-out-of-Docker (DooD): the orchestrator's substrate
      # spawns Julia worker containers via the host's Docker daemon,
      # making them siblings of the kernel + orchestrator containers
      # rather than nested children (D26 §9.5 — "DooD discipline").
      - /var/run/docker.sock:/var/run/docker.sock
      # Shared depot path with identical semantics on host and in the
      # container. The substrate hands host-side bind-mount specs to
      # the host Docker daemon when spawning workers, so the
      # orchestrator's view of the depot path must equal the host
      # view — otherwise the worker container's UDS bind-mount lands
      # in the wrong place and `attach_uds` times out. See
      # `crates/runtime-substrate/src/spawner/docker/depot.rs`.
      - /var/lib/eigenius/substrate-depot:/var/lib/eigenius/substrate-depot
    healthcheck:
      test: ["CMD", "sh", "-c", "deno eval \"const r = await fetch('http://localhost:8080/health'); if (!r.ok) Deno.exit(1);\""]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 2s

volumes:
  eigenius_db:
