[package]
name = "eigenius-wasm-sdk"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "SDK for building WASM components and institutions that run inside the Eigenius kernel or orchestrator. Mirrors the kernel's Eigon data model with no kernel dependency."
keywords = ["eigenius", "wasm", "sdk", "component-model"]
categories = ["wasm", "api-bindings"]

[dependencies]
ciborium = { version = "0.2", default-features = false }
ciborium-io = "0.2"

[lib]
# Can be compiled for wasm32-unknown-unknown or native (for testing).
