// Eigenius Kernel gRPC API
//
// See design doc D5 (docs/design/d5-grpc-api-specification.md)
// for the full specification.

syntax = "proto3";

package eigenius.v1;

service EigeniusKernel {
  // Load resources into a context's working layer, validate, optionally commit.
  rpc Load(LoadRequest) returns (LoadResponse);

  // Resolve a resource by IRI from the context's layer chain.
  rpc Inspect(InspectRequest) returns (InspectResponse);

  // Execute an EigenQL query. Returns an Eigon document (wire-identical
  // to a Load payload) containing a ResultSet plus its row class, row
  // Property definitions, and the row resources themselves. See
  // D2 Appendix A for the document shape.
  rpc Query(QueryRequest) returns (QueryResponse);

  // Type-check a program against the context's layer chain.
  rpc ValidateProgram(ValidateProgramRequest) returns (ValidateProgramResponse);

  // Execute a program with input data.
  rpc RunProgram(RunProgramRequest) returns (RunProgramResponse);

  // Execute a program already loaded into the active layer chain,
  // identified by IRI, against an input also identified by IRI. Avoids
  // the single-content_type limitation of `RunProgram` (where program
  // and input must share an encoding) and matches the natural notebook
  // flow: the user has already loaded the program (typically as ESL)
  // and the input (typically as Eigon-JSON), and now wants to run one
  // against the other without re-shipping bytes.
  rpc RunProgramByIri(RunProgramByIriRequest) returns (RunProgramResponse);

  // Record a reasoning trace.
  rpc Reflect(ReflectRequest) returns (ReflectResponse);

  // Health check.
  rpc Health(HealthRequest) returns (HealthResponse);

  // List indexed institutions and the QueryClasses each declares (D14).
  // FIBER queries against an institution's QueryClasses ride on the
  // regular Query RPC via the FIBER clause (D2 v2 §3.5); per-RPC
  // dispatch primitives from the D10 era (FiberQuery, DiscoverMorphisms)
  // were retired in Phase 12 with no D14 equivalent.
  rpc ListInstitutions(ListInstitutionsRequest) returns (ListInstitutionsResponse);

  // Generate a JSON Schema for an ontology class.
  rpc GetSchema(GetSchemaRequest) returns (GetSchemaResponse);

  // List all tasks in the session (D21 §3.1). Returns empty when no
  // persistent backend is attached — ephemeral kernels don't track
  // tasks across invocations.
  rpc ListTasks(ListTasksRequest) returns (ListTasksResponse);

  // Look up a specific task's status + metadata (D21 §3.1).
  rpc GetTaskStatus(GetTaskStatusRequest) returns (GetTaskStatusResponse);

  // Request cooperative cancellation of a Running / Suspended task
  // (D21 §8 cancellation). Sets the task's cancel flag and
  // transitions to Cancelling; a fully-async evaluator (9b-iii.4)
  // picks this up between IO dispatches and unwinds.
  rpc CancelTask(CancelTaskRequest) returns (CancelTaskResponse);

  // Walk the layer chain and return a graph (nodes + edges) suitable
  // for the notebook's layer-stack visualisation (D22 §4.2). The
  // shape is renderer-agnostic — both the MVP `LayerStackView` (plain
  // JSX boxes-and-arrows) and the Phase 5 full-topology graph
  // (`@xyflow/react`) consume the same response.
  rpc LayerTopology(LayerTopologyRequest) returns (LayerTopologyResponse);

  // --- Branch refs (Phase 14g / D23 §5.5) ---
  //
  // Branches are named pointers into the layer DAG. Reads pin via
  // `at_layer`; writes commit through these RPCs. Branch names match
  // `[A-Za-z0-9_-]+` (max 256 chars).

  // Enumerate every branch ref as (name, head LayerId) pairs.
  rpc ListBranches(ListBranchesRequest) returns (ListBranchesResponse);

  // Resolve a branch name to its current head and chain depth.
  rpc GetBranch(GetBranchRequest) returns (GetBranchResponse);

  // Create a new branch pointing at `from_layer`. Fails if a branch
  // with this name already exists, or if `from_layer` is unknown.
  rpc CreateBranch(CreateBranchRequest) returns (CreateBranchResponse);

  // Remove a branch ref. Layers reachable only through the deleted
  // branch are reclaimed by the next GC pass — the ref itself is
  // gone immediately. With `force=false`, refuses to prune a branch
  // whose head matches an active task pin.
  rpc DeleteBranch(DeleteBranchRequest) returns (DeleteBranchResponse);

  // Explicit merge of `source` into `target` (D34 §6.3). Wraps an
  // `update_branch(target, target_tip, source_tip, AllowTrivial)`
  // call: a fast-forward when source is ahead of target, a trivial
  // merge when their contributions since the LCA touch disjoint
  // IRIs, or `NeedsWitnessedMerge` when they conflict. The latter
  // populates `merge.conflicting_iris` + `merge.orphan_layer_id`
  // (= source_tip) so the caller can offer "save as sibling".
  rpc MergeBranches(MergeBranchesRequest) returns (MergeBranchesResponse);

  // Non-mutating dry-run of `MergeBranches`. Returns the predicted
  // `MergeOutcome` without building a merge layer or moving any
  // branch ref. Powers the explicit Merge dialog's preview pane
  // (D34 §6.3). Cost: same LCA + IRI-disjointness walk as the real
  // merge, minus the layer build + persist.
  rpc PreviewMerge(PreviewMergeRequest) returns (PreviewMergeResponse);

  // --- Chain consolidation (D25) ---

  // Collapse `[from..to]` on `branch` into a single resolve-equivalent
  // consolidated layer whose parent is `parent(from)`. `to` must equal
  // the branch's current head (v1 restriction; see D25 §12.8 for the
  // v2 forward-pointer relaxation). Trace pins are auto-enumerated
  // from the task store and supplied to the kernel.
  //
  // Returns the consolidated `LayerId`, the number of collapsed
  // layers, and a structured error variant (`error_kind`) when the
  // operation can't proceed. See D25 §5.1 for the typed errors.
  rpc ConsolidateChain(ConsolidateChainRequest) returns (ConsolidateChainResponse);

  // Non-mutating dry-run of `ConsolidateChain`. Same validation, same
  // typed errors, no persist and no branch advance. Returns the
  // predicted consolidated `LayerId`, the collapsed-layer count, and
  // both the predicted (upper-bound) and actual (dedup'd) top-of-stack
  // walk-entry counts. The operator pipes the predicted LayerId into
  // a follow-up real `ConsolidateChain` to confirm intent.
  rpc EstimateConsolidation(EstimateConsolidationRequest) returns (EstimateConsolidationResponse);

  // --- Tags (D34 §G.2 / §8) ---
  //
  // Tags are *immutable named refs* into the layer DAG. Unlike
  // branches, a tag's target cannot be retargeted once created —
  // there is intentionally no UpdateTag. A tag pins its target
  // (and the target's transitive ancestors) against GC for as long
  // as it exists. Names match `[A-Za-z0-9_-]+` (same shape as
  // branches, max 256 chars).

  // Create a new tag pointing at `layer_id`. Fails with
  // `AlreadyExists` if a tag with this name already exists; fails
  // with `NotFound` if `layer_id` is not in storage.
  rpc CreateTag(CreateTagRequest) returns (CreateTagResponse);

  // Enumerate every tag as (name, layer_id) pairs.
  rpc ListTags(ListTagsRequest) returns (ListTagsResponse);

  // Remove a tag ref. Idempotent: deleting a non-existent tag is a
  // success with `deleted = false`. The target layer becomes
  // GC-eligible if no other root (branch, active task pin, or
  // another tag) still reaches it.
  rpc DeleteTag(DeleteTagRequest) returns (DeleteTagResponse);
}

// --- Load ---

message LoadRequest {
  bytes resources = 1;          // Resources as CBOR or Eigon-JSON
  string content_type = 2;      // "application/cbor" or "application/eigon+json"
  bool auto_commit = 3;         // Commit after successful validation
  // Branch to commit into (Phase 14g). Empty defaults to "main".
  // Branch must already exist — create with CreateBranch first.
  string branch = 4;
}

message LoadResponse {
  bool success = 1;
  repeated ValidationError errors = 2;
  string layer_id = 3;          // Set if auto_commit succeeded
  uint32 resource_count = 4;
  // Echoes the branch this Load committed to (defaults to "main").
  string branch = 5;
  // D33 §6 / Phase 20c: did this Load actually move the branch ref?
  //
  // - `true`: the freshly-built layer was stored (cache miss) or the
  //  canonical layer at the same position was re-confirmed (cache
  //  hit, same position) — either way, the branch ref now points
  //  at `layer_id`.
  // - `false`: the anchored-commit cache returned a canonical layer
  //  living elsewhere in the DAG (cache hit, different position), or
  //  the CAS resolved to `NEEDS_WITNESSED_MERGE` (see `merge`).
  //  `layer_id` identifies that canonical layer; the branch ref did
  //  not advance to it.
  //
  // Clients that pin to a branch (notebook cells, watchers) read
  // this flag to decide whether to refresh their view.
  bool branch_advanced = 6;
  // D23 §5.4.3 / D34 §G.1: the outcome of the branch-ref CAS that
  // backed this commit. Defaults to `MERGE_OUTCOME_UNSPECIFIED` when
  // no CAS was attempted (no persistent backend, or a different-
  // position anchored-commit cache hit short-circuited the persist).
  MergeInfo merge = 7;
}

// --- Branch merge outcomes (D23 §5.4 / D34 §6) ---

// The result of a `update_branch(AllowTrivial)` CAS attempt that
// backs a layer-committing RPC. Reported on every response that
// commits to a branch (Load, RunProgram, Reflect, Query INTO).
enum MergeOutcome {
  // No CAS happened. The kernel has no persistent backend, or the
  // commit didn't reach the persist step (eval errored, validation
  // rejected the resources, etc.). Notebook UIs treat this as "no
  // commit-shape information available" and render no badge.
  MERGE_OUTCOME_UNSPECIFIED = 0;
  // Clean append — `expected_old` matched the branch's current head
  // and the branch advanced to the caller's `new_head`.
  MERGE_OUTCOME_FAST_FORWARD = 1;
  // Disjoint-IRI auto-reconciliation: concurrent activity moved the
  // branch under the caller, but the two contributions modify
  // non-overlapping resource sets since their LCA. The kernel
  // produced a merge layer with both heads as parents and advanced
  // the branch to it. `merge_layer_id` is the merge layer's id.
  MERGE_OUTCOME_TRIVIAL_MERGE = 2;
  // Real divergence: concurrent contributions touch the same IRIs.
  // The branch was **not** advanced; the caller's layer exists in
  // the DAG but isn't pointed at by any branch ref (and will become
  // GC-eligible unless the caller saves it as a sibling branch).
  // Pre-Phase-15, the caller must resolve manually (sibling branch /
  // rebase / discard).
  MERGE_OUTCOME_NEEDS_WITNESSED_MERGE = 3;
  // The anchored-commit cache (D33 §6) found a content-equivalent
  // layer at a different chain position; the persist short-circuited
  // and the branch ref was **not** advanced. `merge_layer_id` carries
  // the cached layer's id so consumers can read the canonical
  // content there. Distinct from `UNSPECIFIED` so notebook UIs can
  // render a "cached" badge for this case without false-positives
  // on in-memory-only chains.
  MERGE_OUTCOME_CACHED_DIFFERENT_POSITION = 4;
}

message MergeInfo {
  MergeOutcome outcome = 1;
  // Hex-encoded layer id whose meaning depends on `outcome`:
  // - `TRIVIAL_MERGE`: the merge layer the kernel produced (and
  //  advanced the branch to).
  // - `CACHED_DIFFERENT_POSITION`: the cached canonical layer the
  //  freshly-built layer's content was found to match. The branch
  //  ref did **not** advance to it.
  //
  // Empty for `FAST_FORWARD` / `NEEDS_WITNESSED_MERGE` / `UNSPECIFIED`.
  string merge_layer_id = 2;
  // Set when outcome = NEEDS_WITNESSED_MERGE: the IRIs that both
  // contributing chains defined since their LCA — the actual
  // conflict set. Useful for the user-facing recovery dialog.
  repeated string conflicting_iris = 3;
  // Set when outcome = NEEDS_WITNESSED_MERGE: hex-encoded id of the
  // branch's current head (i.e., what the caller raced against and
  // lost to).
  string current_head = 4;
  // Set when outcome = NEEDS_WITNESSED_MERGE: hex-encoded id of the
  // *orphan* layer — the layer the caller built that wasn't merged
  // onto the branch. It's still on disk but only reachable by id.
  // The notebook's witnessed-merge recovery dialog (D34 §6.2) uses
  // it to offer "Save my work as a sibling branch", which calls
  // `CreateBranch(name, orphan_layer_id)` to keep it reachable.
  // Without saving, the layer becomes GC-eligible.
  string orphan_layer_id = 5;
}

// --- Inspect ---

message InspectRequest {
  string iri = 1;
  // Optional hex-encoded LayerId to pin the read to a specific layer
  // instead of the session's active top (D21 §3.6). Empty = active top.
  // Useful for inspecting forked task result layers.
  string at_layer = 2;
  // Optional branch name (Phase 14g). Pin reads to this branch's
  // current head. Mutually exclusive with `at_layer`. Empty = "main".
  string branch = 3;
}

message InspectResponse {
  bool found = 1;
  bytes resource = 2;           // Resource as CBOR
}

// --- Query ---

message QueryRequest {
  string eigenql = 1;           // EigenQL program string
  // Optional hex-encoded LayerId to evaluate the query against a
  // specific layer instead of the session's active top (D21 §3.6).
  string at_layer = 2;
  // Optional branch name (Phase 14g). Pin reads to this branch's
  // current head. Mutually exclusive with `at_layer`. Empty = "main".
  string branch = 3;
}

message QueryResponse {
  bool success = 1;
  // Eigon-CBOR document: an array of top-level resources. The ResultSet
  // resource references the row class (by IRI) and the row resources
  // (by IRI or embedded). Property and Class resources for the row
  // schema are included so clients can discover short-name ↔ IRI
  // mappings without hardcoding conventions. Empty on failure.
  bytes document = 2;
  string content_type = 3;      // "application/cbor"
  string error = 4;             // Error message if !success
  // IRIs of resources committed to the chain by FIBER ... INTO clauses
  // (D14 §9.3 chain-reinsertion via EigenQL). Each entry corresponds to
  // exactly one chain-resident response resource the query just
  // produced. Clients can resolve them via Inspect or follow-on queries.
  repeated string output_resource_iris = 5;
  // D33 §6 / Phase 20c: did the FIBER ... INTO commit (if any) actually
  // move the branch ref? See `LoadResponse.branch_advanced` for the
  // full semantics. Always `false` for queries with no INTO clauses
  // (nothing committed → no branch motion to report).
  bool branch_advanced = 6;
  // D23 §5.4.3 / D34 §G.1: outcome of the FIBER INTO commit's branch
  // CAS, if one ran. `MERGE_OUTCOME_UNSPECIFIED` for queries that
  // produced no INTO commit (nothing to merge against) or for
  // different-position cache hits.
  MergeInfo merge = 7;
}

// --- ValidateProgram ---

message ValidateProgramRequest {
  bytes program = 1;            // Program resource as CBOR or Eigon-JSON
  string content_type = 2;
}

message ValidateProgramResponse {
  bool valid = 1;
  repeated ValidationError errors = 2;
  string program_type = 3;      // Human-readable type
}

// --- RunProgram ---

message RunProgramRequest {
  bytes program = 1;            // Program as CBOR or Eigon-JSON
  bytes input = 2;              // Input as CBOR or Eigon-JSON
  string content_type = 3;
  // Branch the trace layer commits into (Phase 14g). Empty = "main".
  string branch = 4;
}

message RunProgramResponse {
  bool success = 1;
  bytes output = 2;             // Output resource as CBOR
  repeated ValidationError errors = 3;
  string trace_iri = 4;         // IRI of the ProgramTrace (if execution succeeded)
  string task_id = 5;           // Task UUID (D21). Empty string if no
                                // persistent backend — the task is ephemeral
                                // and cannot be looked up via GetTaskStatus.
  // IRIs of resources committed to the chain by this run (D14 §9.3 step 4):
  // comorphism reify outputs and the program's final Resource value, each
  // assigned a deterministic content-hash IRI. Clients can resolve these
  // against the chain to get the chain-resident copies.
  repeated string output_resource_iris = 6;
  // D33 §6 / Phase 20c: did this run's trace-layer commit actually move
  // the branch ref? See `LoadResponse.branch_advanced` for the full
  // semantics. `true` iff at least one of the program-run layer or the
  // (optional) AutoOnLoad provenance layer advanced the branch. An
  // idempotent re-run against the same supporting context hits the
  // anchored-commit cache and reports `false`.
  bool branch_advanced = 7;
  // D23 §5.4.3 / D34 §G.1: outcome of the program-run user-layer's
  // branch CAS. The (optional) AutoOnLoad provenance layer's CAS
  // outcome is not surfaced here — it'd be a follow-up CAS chained
  // on top, and surfacing both would conflate two distinct events.
  // See [`LoadResponse.merge`] for the per-outcome semantics.
  MergeInfo merge = 8;
}

// --- RunProgramByIri ---

message RunProgramByIriRequest {
  string program_iri = 1;       // IRI of a program resource in the active layer chain
  string input_iri = 2;         // IRI of the input resource in the active layer chain
  // Optional hex-encoded LayerId to pin both reads to a specific layer
  // instead of the session's active top (D21 §3.6). Empty = active top.
  string at_layer = 3;
  // Branch the trace layer commits into (Phase 14g). Empty = "main".
  // Reads still respect `at_layer` independently of `branch`.
  string branch = 4;
}

// --- Reflect ---

message ReflectRequest {
  bytes trace = 1;
  string content_type = 2;
  // Branch the trace layer commits into (Phase 14g). Empty = "main".
  string branch = 3;
}

message ReflectResponse {
  bool success = 1;
  string trace_iri = 2;
  // D33 §6 / Phase 20c: did the reflect commit actually move the
  // branch ref? See `LoadResponse.branch_advanced` for the full
  // semantics. Reflecting an already-reflected trace hits the
  // anchored-commit cache and reports `false`.
  bool branch_advanced = 3;
  // D23 §5.4.3 / D34 §G.1: outcome of the reflect commit's branch
  // CAS. See [`LoadResponse.merge`] for the per-outcome semantics.
  MergeInfo merge = 4;
}

// --- Health ---

message HealthRequest {}

message HealthResponse {
  bool healthy = 1;
  string version = 2;
  uint64 layer_count = 3;
  uint64 resource_count = 4;
  // D21 §4 resume observability: true while the startup resume
  // sweep is still enqueuing or draining Running/Suspended tasks.
  bool resume_in_progress = 5;
  uint32 tasks_resuming = 6;    // Tasks currently in the resume queue
}

// --- Component Execution (kernel → orchestrator) ---

service ComponentExecutor {
  // Execute an IO component. Called by the kernel when evaluating a
  // program that references a remote component (e.g. CompleteText).
  rpc Execute(ComponentRequest) returns (ComponentResponse);

  // Register a WASM IO component with the orchestrator. Called by the
  // kernel when loading a component with capability_level=io and
  // implementation=wasm. The orchestrator transpiles the Component Model
  // binary (jco) and instantiates it when Execute is called.
  rpc RegisterWasmComponent(RegisterWasmComponentRequest)
      returns (RegisterWasmComponentResponse);

  // D31 §6.2 — Phase 19a.5.c. Dispatch an external-runtime institution
  // procedure. Called by the kernel during commit-time AutoOnLoad
  // gating (and during query / Decidable evaluation) when the matched
  // institution declares `runtime: external`. The orchestrator routes
  // the call into the substrate (DockerServiceSpawner + Julia worker),
  // returns the institution-produced output (e.g. a Verdict resource)
  // alongside the partial RuntimeInvocation provenance.
  rpc DispatchExternal(DispatchExternalRequest)
      returns (DispatchExternalResponse);
}

message RegisterWasmComponentRequest {
  string component_iri = 1;     // IRI the kernel will use to dispatch
  bytes wasm_binary = 2;        // Raw Component Model binary bytes
  uint64 fuel_limit = 3;        // Optional fuel budget per invocation (0 = default)
  uint64 memory_limit_pages = 4; // Optional memory cap in 64KB pages (0 = default)
}

message RegisterWasmComponentResponse {
  bool success = 1;
  string error = 2;
}

message ComponentRequest {
  string component_iri = 1;    // Which component to execute
  bytes input = 2;             // Input resource as CBOR or Eigon-JSON
  bytes argument = 3;          // Argument/config resource
  string content_type = 4;     // "application/cbor" or "application/eigon+json"
}

message ComponentResponse {
  bool success = 1;
  bytes output = 2;            // Output resource as CBOR or Eigon-JSON
  string error = 3;            // Error message if !success
  ComponentMetrics metrics = 4;
}

message ComponentMetrics {
  string provider = 1;         // e.g. "anthropic"
  string model = 2;            // e.g. "claude-sonnet-4-20250514"
  int64 prompt_tokens = 3;
  int64 completion_tokens = 4;
  int64 latency_ms = 5;
}

// --- D31 §6.2 — External Institution Dispatch (Phase 19a.5.c) ---

message DispatchExternalRequest {
  // Substrate-assigned correlation ID for the invocation. Carried
  // through to RuntimeInvocation provenance.
  string invocation_id = 1;

  // IRI of the Institution being dispatched. For logging / audit
  // only; the orchestrator routes by env_iri + image_digest below.
  string institution_iri = 2;

  // IRI of the RuntimeEnvironment the institution declares. The
  // orchestrator looks up the env's image_digest from the chain (or
  // uses the value sent in `image_digest` directly).
  string env_iri = 3;

  // Image digest the worker should run against (`sha256:...`). Set
  // alongside env_iri so the orchestrator doesn't need an extra
  // chain query during dispatch.
  string image_digest = 4;

  // Function name the worker resolves in `Main` after handler-package
  // `using` import. Maps to D29 §8.5's worker dispatch convention.
  string method_name = 5;

  // IRI of the RuntimeMethodSignature this dispatch satisfies.
  // Recorded on the RuntimeInvocation's `script` property.
  string signature_iri = 6;

  // CBOR-encoded mirror struct values, in argument order. For
  // AutoOnLoad / Decidable QueryClass dispatches this is a single-
  // element list (the gated subject). For OnDemand / CallRuntimeMethod
  // surfaces this carries the Sigma-lowered components per
  // D31 §6.5.
  repeated bytes input_resource_cbors = 7;

  // Language identifier (`"julia"`, `"python"`, …). The orchestrator's
  // SubstrateDispatcher routes by this string against its registered
  // `LanguageRuntime` registry. Resolved at kernel registration time
  // from the RuntimeEnvironment's `language` property and forwarded
  // here so the orchestrator stays stateless wrt the chain.
  string language = 8;
}

message DispatchExternalResponse {
  // CBOR-encoded output resource. For AutoOnLoad / Decidable this is
  // a Verdict resource (Holds | Fails | Undecidable per D31 §6.3).
  // For OnDemand / CallRuntimeMethod it's the QueryClass.result_class
  // instance.
  bytes output_resource_cbor = 1;

  // CBOR-encoded partial RuntimeInvocation carrying the substrate-
  // captured trace fields: dispatched_to (Julia's `which()`),
  // image_digest, started_at / completed_at (RFC3339), and
  // numerical_metadata (host kernel, FMA flag, BLAS version).
  bytes runtime_invocation_partial_cbor = 2;
}

// --- Institution Protocol (D14) ---

message ListInstitutionsRequest {
  // Optional hex-encoded LayerId to read against a specific layer
  // (D21 §3.6). Empty = session's active top.
  string at_layer = 1;
}

message ListInstitutionsResponse {
  repeated InstitutionInfo institutions = 1;
}

message InstitutionInfo {
  string iri = 1;
  string name = 2;
  // QueryClass input-class IRIs declared by this institution. Each
  // entry corresponds to a `QueryClass` resource whose
  // `institution_ref` points at this institution.
  repeated string query_types = 3;
}

// --- GetSchema ---

message GetSchemaRequest {
  string class_iri = 1;           // IRI of the class to generate schema for
  // Optional hex-encoded LayerId (D21 §3.6). Empty = session's active top.
  string at_layer = 2;
}

message GetSchemaResponse {
  bool success = 1;
  string json_schema = 2;         // JSON Schema as a JSON string
  string error = 3;               // Error message if !success
}

// --- Tasks (D21) ---

message TaskInfo {
  string task_id = 1;             // UUID
  string session_id = 2;          // UUID (always nil in 9b-iii)
  string program_iri = 3;
  string input_iri = 4;
  string status = 5;              // Running | Suspended | Cancelling |
                                  // Completed | Failed | Cancelled
  string layer_head = 6;          // hex-encoded pinned LayerId
  uint64 step_seq = 7;
  uint64 latest_trace_seq = 8;
  // Empty string when no checkpoint has been committed yet.
  // Present as string-encoded step_seq, not a LayerId, matching
  // TaskRecord.last_checkpoint: Option<u64>.
  string last_checkpoint_step = 9;
  string result_layer_head = 10;  // hex-encoded LayerId when Completed; empty otherwise
  int64 created_at_ms = 11;
  int64 updated_at_ms = 12;
  bool retain_forever = 13;
}

message ListTasksRequest {}

message ListTasksResponse {
  repeated TaskInfo tasks = 1;
}

message GetTaskStatusRequest {
  string task_id = 1;             // UUID as string
}

message GetTaskStatusResponse {
  bool found = 1;
  TaskInfo task = 2;
}

message CancelTaskRequest {
  string task_id = 1;             // UUID as string
}

message CancelTaskResponse {
  bool success = 1;
  string status = 2;              // The post-cancel status ("Cancelling" or "Cancelled"
                                  // if the task was already Running; "Completed"/"Failed"
                                  // if the task had already reached a terminal state)
  string error = 3;               // Error message if !success (e.g. no task_store, task not found)
}

// --- Common ---

message ValidationError {
  string resource_iri = 1;
  string property_iri = 2;
  string rule = 3;
  string message = 4;
  string severity = 5;
}

// --- LayerTopology (D22 §4.2) ---

message LayerTopologyRequest {
  // Optional hex-encoded LayerId to root the walk at a specific layer
  // instead of the session's active top (D21 §3.6 convention). Empty =
  // active top.
  string root_layer = 1;

  // Maximum walk depth, counted in parent-pointer hops from `root_layer`.
  // 0 (the default) means unlimited; the walker traverses the full chain.
  uint32 max_depth = 2;

  // When true, the walker emits a node per resource (any class). When
  // false (the default), only Class / Property / Institution resources
  // become nodes; ordinary instance resources are aggregated into per-
  // layer counts in the layer node's `attrs`. The MVP `LayerStackView`
  // sets this false; the Phase 5 full-topology graph sets it true.
  bool include_resources = 3;
}

message LayerTopologyResponse {
  repeated TopologyNode nodes = 1;
  repeated TopologyEdge edges = 2;
}

message TopologyNode {
  // For LAYER nodes: hex-encoded LayerId. For everything else: the IRI.
  string id = 1;
  NodeKind kind = 2;
  // Short label for the renderer. For Class / Property / Institution:
  // the resource's `core:short_name` if present, else the local IRI tail.
  // For LAYER: the layer's `name` (per `Layer::name()`).
  string label = 3;
  // Free-form metadata for the renderer. For LAYER nodes: includes
  // `class_count`, `property_count`, `resource_count`, `institution_count`
  // when `include_resources=false`. For Class / Property: may include
  // `description`, `data_type` (for Property), etc.
  map<string, string> attrs = 4;
}

enum NodeKind {
  NODE_KIND_UNSPECIFIED = 0;
  NODE_KIND_LAYER = 1;
  NODE_KIND_CLASS = 2;
  NODE_KIND_PROPERTY = 3;
  NODE_KIND_RESOURCE = 4;
  NODE_KIND_INSTITUTION = 5;
}

message TopologyEdge {
  string source = 1;        // node id
  string target = 2;        // node id
  EdgeKind kind = 3;
  map<string, string> attrs = 4;
}

enum EdgeKind {
  EDGE_KIND_UNSPECIFIED = 0;
  EDGE_KIND_PARENT_LAYER = 1;       // child layer → parent layer
  EDGE_KIND_IS_A = 2;               // resource → class
  EDGE_KIND_SUBCLASS_OF = 3;        // class → parent class
  EDGE_KIND_REQUIRES = 4;           // class → required property
  EDGE_KIND_RECOMMENDS = 5;         // class → recommended property
  EDGE_KIND_PROPERTY_REF = 6;       // property → referenced class (via class_types)
  EDGE_KIND_INSTITUTION_DECLARES = 7; // institution → declared class
}

// --- Branch refs (Phase 14g / D23 §5.5) ---

message BranchInfo {
  string name = 1;          // matches [A-Za-z0-9_-]+
  string head_layer = 2;    // hex-encoded LayerId
  // Head layer's commit timestamp, in milliseconds since Unix epoch.
  // Same semantics as `GetBranchResponse.head_committed_at_ms`. Powers
  // the notebook's branch-picker / Branches-panel "X min ago" stamps
  // without forcing per-row `GetBranch` fan-out.
  int64 head_committed_at_ms = 3;
}

message ListBranchesRequest {}

message ListBranchesResponse {
  repeated BranchInfo branches = 1;
}

message GetBranchRequest {
  string name = 1;
}

message GetBranchResponse {
  bool found = 1;
  // Set when found=true; hex-encoded LayerId of the branch's current head.
  string head_layer = 2;
  // Set when found=true; the head layer's commit timestamp, in
  // milliseconds since the Unix epoch. Matches `Layer.created_at` /
  // `LayerHandle.created_at` / D21's `TaskRecord.created_at`. Powers
  // the notebook's branch-picker "X min ago" relative timestamps
  // (D34 §3.2 / §4.2). 0 when not available (e.g., the kernel can
  // resolve the branch ref but the head's handle was reclaimed by
  // GC — should not happen in practice, but the wire shape
  // tolerates it).
  int64 head_committed_at_ms = 3;
}

message CreateBranchRequest {
  string name = 1;          // must match [A-Za-z0-9_-]+
  // Hex-encoded LayerId to start the branch from. Must be a known layer.
  string from_layer = 2;
}

message CreateBranchResponse {
  bool success = 1;
  // Echo of the created branch's head; empty on failure.
  string head_layer = 2;
  string error = 3;         // populated when !success
}

message DeleteBranchRequest {
  string name = 1;
  // When false, refuse to prune if the branch's head matches an active
  // task pin (lattice::PruneSafety::CheckPins). When true, delete
  // unconditionally (PruneSafety::Force).
  bool force = 2;
}

message DeleteBranchResponse {
  bool success = 1;
  // True when the branch existed and was deleted; false when it didn't
  // exist (still success=true). When success=false, see `error`.
  bool deleted = 2;
  // Hex-encoded LayerId the branch pointed at before deletion (when
  // deleted=true); empty otherwise.
  string previous_head = 3;
  string error = 4;
}

message MergeBranchesRequest {
  // Branch to fold into `target`. Read at request-time to get its
  // current head. Must exist; the kernel rejects unknown names with
  // `failed_precondition`.
  string source = 1;
  // Branch to receive the merge. Read at request-time to get its
  // current head; mutated by the `update_branch` CAS the handler
  // dispatches.
  string target = 2;
}

message MergeBranchesResponse {
  bool success = 1;
  // Error message when `success=false`. Empty otherwise.
  string error = 2;
  // Outcome of the CAS — same shape as commit responses. Populated
  // when the merge attempt reached the lattice's `update_branch`.
  MergeInfo merge = 3;
  // Target branch's new tip on success. Equals the source's tip on
  // fast-forward, the merge layer's id on trivial merge, or the
  // target's unchanged tip on `NEEDS_WITNESSED_MERGE`. Empty on
  // error before the merge attempt.
  string target_tip = 4;
}

message PreviewMergeRequest {
  string source = 1;
  string target = 2;
}

message PreviewMergeResponse {
  bool success = 1;
  // Error message when `success=false`. Empty otherwise.
  string error = 2;
  // Predicted outcome. `success=true` always; the predicted
  // `MergeOutcome` enum (FAST_FORWARD / TRIVIAL_MERGE /
  // NEEDS_WITNESSED_MERGE) signals what would happen on a real
  // merge. Side fields (`merge_layer_id`, `current_head`,
  // `orphan_layer_id`) are NOT populated in preview — those refer
  // to layers the kernel hasn't built yet. `conflicting_iris` IS
  // populated when the prediction is `NEEDS_WITNESSED_MERGE` (no
  // build cost, just the disjointness check).
  MergeInfo merge = 3;
  // Number of IRIs the merge layer would carry (union of per-head
  // contributions). 0 for fast-forward / conflict. Useful for the
  // dialog's preview line.
  uint32 predicted_iri_count = 4;
}

// --- Chain consolidation (D25) ---

// Typed error variants surfaced by the consolidation RPCs. Mirrors
// `crate::layer::ConsolidateError`; lets the CLI dispatch on the
// kind instead of regex-matching the human-readable `error`
// string.
//
// Variants are intentionally short (no `CONSOLIDATE_ERROR_` prefix)
// because prost retains proto prefixes when generating Rust enum
// variants — duplicating the enum name in each variant would produce
// awkward `ConsolidateErrorKind::ConsolidateErrorNone` callsites.
enum ConsolidateErrorKind {
  // No error / unset. Successful responses leave this at the default.
  NONE = 0;
  // `from` is not an ancestor of `to`.
  RANGE_NOT_ANCESTRAL = 1;
  // The branch ref didn't match the expected head (concurrent advance,
  // or the operator passed a stale `to`).
  BRANCH_ADVANCED = 2;
  // The range contains a multi-parent merge layer (D25 §8.1).
  RANGE_CONTAINS_MERGE_NODE = 3;
  // The range contains a layer pinned by an active task trace
  // (TracePinPolicy::Refuse).
  RANGE_CONTAINS_TRACE_PIN = 4;
  // Predicted walk size exceeds `max_walk_entries`.
  COST_EXCEEDS_CAP = 5;
  // Underlying storage write failure or other internal fault.
  INTERNAL = 6;
  // `to` exists in storage but isn't on the chain `branch` currently
  // points at — a redirect installed at `to` would be unreachable.
  // Phase 17f below-head consolidation only.
  TO_NOT_REACHABLE_FROM_HEAD = 7;
  // The consolidation range crosses an existing resolve redirect
  // (D25 §12.8.1(a)). v1 refuses; the future compose policy (issue
  // #49) will lift this.
  RANGE_CROSSES_EXISTING_REDIRECT = 8;
}

message ConsolidateChainRequest {
  // Branch to consolidate. An empty string defaults to "main"
  // (matches LoadRequest's convention).
  string branch = 1;
  // Hex-encoded LayerId where the consolidation range starts (oldest).
  string from_layer = 2;
  // Hex-encoded LayerId where the consolidation range ends (newest).
  // When equal to the branch's current head: at-head consolidation
  // advances the branch ref to the consolidated layer. When strictly
  // below the head: below-head consolidation installs a resolve
  // redirect at `to` (D25 §12.8 / Phase 17f) and leaves the branch
  // unchanged.
  string to_layer = 3;
  // Cost cap: refuse if `sum(handle.resource_count for handle in range)`
  // exceeds this. Pass 0 to use the kernel default
  // (`ConsolidateOpts::default`).
  uint64 max_walk_entries = 4;
  // Reserved for v2 trace-pin policies. v1 ignores this field; the
  // kernel always uses `TracePinPolicy::Refuse`.
  string trace_pin_policy = 5;
  // Preserve the pre-consolidation history of the source range
  // (D25 §12.8.1(b)). When `true` and the consolidation is below-head,
  // GC's mark phase will keep the source-side chain alive so
  // time-travel reads against intermediate layers continue to
  // resolve. Default `false` (reclaim mode — the consolidated range
  // becomes eligible for sweep). Ignored for at-head consolidations.
  bool preserve_history = 6;
}

message ConsolidateChainResponse {
  bool success = 1;
  // Hex-encoded LayerId of the consolidated layer; empty on failure.
  string consolidated_layer = 2;
  // Number of layers in the original range that were collapsed.
  uint64 collapsed_layer_count = 3;
  // True when the branch's head moved (always true on success in v1).
  bool head_advanced = 4;
  // Typed error kind. CONSOLIDATE_ERROR_NONE on success.
  ConsolidateErrorKind error_kind = 5;
  // Human-readable error text; empty on success.
  string error = 6;
  // Echo of the offending layer id for kind=MERGE_NODE / TRACE_PIN
  // / BRANCH_ADVANCED. Empty otherwise.
  string error_layer = 7;
  // Echo of the trace count for kind=TRACE_PIN; the predicted entry
  // count for kind=COST_EXCEEDS_CAP. Zero otherwise.
  uint64 error_count = 8;
}

message EstimateConsolidationRequest {
  string branch = 1;
  string from_layer = 2;
  string to_layer = 3;
  uint64 max_walk_entries = 4;
  string trace_pin_policy = 5;
  bool preserve_history = 6;
}

message EstimateConsolidationResponse {
  bool success = 1;
  // Hex-encoded LayerId the consolidated layer would have if
  // ConsolidateChain were invoked with the same inputs.
  string predicted_consolidated_layer = 2;
  uint64 collapsed_layer_count = 3;
  // Upper-bound prediction (counted before dedup).
  uint64 predicted_walk_entries = 4;
  // Actual deduplicated walk size (≤ predicted; the gap is the
  // dedup savings).
  uint64 actual_walk_entries = 5;
  ConsolidateErrorKind error_kind = 6;
  string error = 7;
  string error_layer = 8;
  uint64 error_count = 9;
}

// --- Tags (D34 §G.2 / §8) ---

message TagInfo {
  // Matches `[A-Za-z0-9_-]+`, max 256 chars.
  string name = 1;
  // Hex-encoded LayerId the tag points at.
  string layer_id = 2;
  // Layer's commit timestamp (millis since Unix epoch), surfaced so
  // the notebook's Tags panel can show "tagged at <time>" without
  // a per-row GetBranch fan-out. Zero when the layer's handle
  // couldn't be loaded.
  int64 tagged_at_ms = 3;
}

message CreateTagRequest {
  string name = 1;
  // Hex-encoded LayerId. The kernel verifies the layer exists in
  // storage; an unknown id is rejected with `NotFound`.
  string layer_id = 2;
}

message CreateTagResponse {
  bool success = 1;
  // Human-readable error text; empty on success. Populated when the
  // tag name is invalid, the name is already in use, or `layer_id`
  // doesn't resolve.
  string error = 2;
  // True when the name was already taken by an existing tag. The
  // client distinguishes "name collision" from other failures so a
  // retry-with-different-name UX can short-circuit.
  bool already_exists = 3;
}

message ListTagsRequest {}

message ListTagsResponse {
  repeated TagInfo tags = 1;
}

message DeleteTagRequest {
  string name = 1;
}

message DeleteTagResponse {
  bool success = 1;
  string error = 2;
  // True when the tag existed and was removed; false when the call
  // was idempotent (no tag by that name).
  bool deleted = 3;
}

// --- NotebookService (D22 §3.2) ---

// Browser-facing service. Initially contains only `LayerTopology` as a
// thin proxy over the kernel. Future browser-specific RPCs that don't
// fit the kernel's machine-to-machine surface will join this service
// without touching `EigeniusKernel`.
service NotebookService {
  rpc LayerTopology(LayerTopologyRequest) returns (LayerTopologyResponse);
}
