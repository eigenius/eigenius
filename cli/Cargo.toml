[package]
name = "eigenius-cli"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "eigenius"
path = "src/main.rs"

[dependencies]
eigenius-kernel = { path = "../kernel" }
eigenius-storage-rocksdb = { path = "../storage/rocksdb" }
# 19a.5.a: pulled in for the JuliaMirrorGenerator; the CLI runs mirror
# generation client-side via a RemoteChainAccessor over gRPC.
eigenius-julia = { path = "../crates/eigenius-julia" }
eigenius-runtime-substrate = { path = "../crates/runtime-substrate" }
clap = { version = "4", features = ["derive", "env"] }
futures = "0.3"
humantime = "2"
serde_json.workspace = true
tokio.workspace = true
tonic.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
