[package]
name = "eigenius-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Eigenius command-line interface — load, query, validate, run programs, and administer kernel databases either in-process or against a running gRPC server."
keywords = ["eigenius", "knowledge-graph", "cli", "grpc", "rocksdb"]
categories = ["command-line-utilities", "science"]

[[bin]]
name = "eigenius"
path = "src/main.rs"

[dependencies]
eigenius-kernel = { path = "../kernel" }
eigenius-storage-rocksdb = { path = "../storage/rocksdb" }
# 19a.5.a: pulled in for the JuliaMirrorGenerator; the CLI runs mirror
# generation client-side via a RemoteChainAccessor over gRPC.
eigenius-julia = { path = "../crates/eigenius-julia" }
# 20a.4: the kernel binary links the Lean verification institution
# directly. `LeanInstitution::query` runs in-process — no IPC, no
# orchestrator round-trip — so the verification TCB stays bounded by
# nanoda's acceptance (D28 §2.3 / §10.2).
eigenius-lean = { path = "../crates/eigenius-lean" }
# D39 Phase 8: the Reasoning institution's validator is the kernel's
# own NbE checker — no external runtime — so the verification TCB is
# bounded by the kernel's type-theory implementation. Linked in
# alongside Lean so AutoOnLoad ValidateJustification on every
# ReasoningSentence commit dispatches as a direct function call.
eigenius-reasoning = { path = "../crates/eigenius-reasoning" }
# D52: the measurement-statistics institution's validator runs
# in-process — deterministic IEEE-754 numerics (ndarray + statrs); no
# IPC, no orchestrator round-trip. Linked in alongside Reasoning so
# AutoOnLoad validate_measurement_claim on every MeasurementClaim
# commit recomputes the claim and emits Holds/Fails as a direct
# function call. Composes with Reasoning via the D49 chain-witness
# index: the emitted DerivedResource's canonical_proposition becomes
# the IsDerivedAs witness any downstream ReasoningSentence's
# DerivedEvidence ctor consumes.
eigenius-statistics = { path = "../crates/eigenius-statistics" }
eigenius-runtime-substrate = { path = "../crates/runtime-substrate" }
eigenius-config = { path = "../crates/eigenius-config" }
# D43: BGE-small Candle embedder. Pulled in by the `serve` path so
# `cmd_serve` can register a CandleEmbedder when `[embedder].enabled`
# names it. The crate has its own `cuda` / `metal` features; this
# manifest forwards them via the `cuda` / `metal` features below so
# `cargo build -p eigenius-cli --features cuda` propagates correctly.
eigenius-embedder-candle = { path = "../crates/eigenius-embedder-candle" }
clap = { version = "4", features = ["derive", "env"] }
futures = "0.3"
humantime = "2"
serde_json.workspace = true
tokio.workspace = true
tonic.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[features]
# Forwarded to `eigenius-embedder-candle`. Build the CLI with
# `--features cuda` to ship a GPU-capable `eigenius serve` binary;
# the binary still runs on CPU when `[embedder].device = "cpu"` or
# the GPU isn't visible at runtime.
default = []
cuda = ["eigenius-embedder-candle/cuda"]
metal = ["eigenius-embedder-candle/metal"]
